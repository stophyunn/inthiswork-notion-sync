name: Migrate Notion Schema

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type MIGRATE to add missing rich-text properties
        required: true
        type: string

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate confirmation
        if: ${{ inputs.confirmation != 'MIGRATE' }}
        run: exit 1
      - name: Add missing properties
        if: ${{ inputs.confirmation == 'MIGRATE' }}
        env:
          MIGRATION_CONFIRMATION: ${{ inputs.confirmation }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ vars.NOTION_DATA_SOURCE_ID }}
          NOTION_API_VERSION: "2025-09-03"
        run: python -m src.migrate_notion_schema
