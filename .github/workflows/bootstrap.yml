name: Bootstrap Notion Database

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "데이터베이스를 새로 만들려면 CREATE를 입력하세요"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: notion-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "CREATE" ]; then
            echo "confirm 입력값이 CREATE가 아닙니다."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Validate required secrets
        shell: bash
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}
        run: |
          missing=()
          [[ -n "$NOTION_TOKEN" ]] || missing+=(NOTION_TOKEN)
          [[ -n "$NOTION_PARENT_PAGE_ID" ]] || missing+=(NOTION_PARENT_PAGE_ID)
          if (( ${#missing[@]} )); then
            printf '::error::필수 GitHub Actions Secret이 없습니다: %s\n' "${missing[*]}"
            exit 1
          fi
          echo "필수 Secret 이름과 설정 여부를 확인했습니다(값은 출력하지 않음)."

      - name: Create Notion database
        id: bootstrap
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}
          NOTION_API_VERSION: "2025-09-03"
          BOOTSTRAP_CONFIRM: ${{ inputs.confirm }}
        shell: bash
        run: |
          set -o pipefail
          set +e
          python -u -m src.bootstrap 2>&1 | tee bootstrap-output.txt
          bootstrap_status=${PIPESTATUS[0]}
          set -e
          {
            echo "## Notion 데이터베이스 생성 결과"
            echo '```text'
            cat bootstrap-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$bootstrap_status"

      - name: Upload bootstrap output
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-output
          path: bootstrap-output.txt
          retention-days: 7
